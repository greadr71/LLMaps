{# Base HTML template for LLMaps. #}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title or "LLMaps" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>{{ llmaps_css | safe }}{% if custom_css %}
{{ custom_css | safe }}{% endif %}</style>
  </head>
  <body>
    <div id="map-root"></div>
{{ legend_html | safe }}
{% if custom_html %}{{ custom_html | safe }}{% endif %}
    <script id="llmaps-config" type="application/json">
      {{ map_config_json | safe }}
    </script>
    <script src="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/maplibre/maplibre-gl-compare@main/dist/maplibre-gl-compare.js"></script>
    {% if use_compression %}
    <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
    <script src="https://unpkg.com/pbf@3.2.1/dist/pbf.js"></script>
    <script src="https://unpkg.com/geobuf@3.0.2/dist/geobuf.js"></script>
    {% endif %}
    {% if user_data_json %}<script>window.llmapsData = {{ user_data_json | safe }};</script>{% endif %}
    <script>{{ llmaps_js | safe }}</script>
    {% if custom_js %}<script>{{ custom_js | safe }}</script>{% endif %}
  </body>
</html>
